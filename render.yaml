# Apply only after the repository's historical database exports and vulnerabilities are addressed.
services:
  - type: web
    name: aaa-services-api
    runtime: node
    plan: free
    branch: main
    rootDir: Back-End/server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/status
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: MONGO_URI
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_KEY
        generateValue: true

  - type: web
    name: aaa-services-web
    runtime: static
    branch: main
    rootDir: Front End
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: VITE_API_URL
        sync: false
      - key: VITE_SOCKET_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
